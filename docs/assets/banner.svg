<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="50%" stop-color="#181a1f"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c8cff"/>
      <stop offset="100%" stop-color="#a4baff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c8cff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="16" fill="none" stroke="#2e3238" stroke-width="1.5"/>

  <!-- Radial Glow Behind Center -->
  <circle cx="600" cy="140" r="300" fill="url(#glow)"/>

  <!-- Subtle Grid Accent -->
  <g opacity="0.04" stroke="#e6e8eb" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- Title & Branding -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif">
    <!-- Title -->
    <text x="600" y="125" font-size="54" font-weight="700" fill="#e6e8eb" letter-spacing="-0.02em">
      SIMULACRUM
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="172" font-size="20" font-weight="400" fill="#8b919a" letter-spacing="0.01em">
      Fast, pixel-perfect multi-size icon maker for Windows
    </text>

    <!-- Chips / Feature Badges -->
    <g transform="translate(300, 220)">
      <!-- Chip 1: Tauri v2 + Rust -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="17" fill="#1a1c20" stroke="#2e3238" stroke-width="1"/>
        <text x="65" y="22" font-size="12" font-weight="500" fill="#6c8cff">Tauri v2 + Rust</text>
      </g>
      <!-- Chip 2: Lanczos3 Resampling -->
      <g transform="translate(142, 0)">
        <rect width="150" height="34" rx="17" fill="#1a1c20" stroke="#2e3238" stroke-width="1"/>
        <text x="75" y="22" font-size="12" font-weight="500" fill="#6c8cff">Lanczos3 Master</text>
      </g>
      <!-- Chip 3: Anti-aliased Masks -->
      <g transform="translate(304, 0)">
        <rect width="150" height="34" rx="17" fill="#1a1c20" stroke="#2e3238" stroke-width="1"/>
        <text x="75" y="22" font-size="12" font-weight="500" fill="#6c8cff">Analytic Anti-Aliasing</text>
      </g>
      <!-- Chip 4: Batch Export -->
      <g transform="translate(466, 0)">
        <rect width="134" height="34" rx="17" fill="#1a1c20" stroke="#2e3238" stroke-width="1"/>
        <text x="67" y="22" font-size="12" font-weight="500" fill="#6c8cff">Batch Export</text>
      </g>
    </g>
  </g>
</svg>
